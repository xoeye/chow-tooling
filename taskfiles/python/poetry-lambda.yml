# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Poetry-based AWS Lambda build tasks
#
# Builds Lambda deployment packages with code/layer separation:
# - code.zip: Application code + local editable dependencies
# - layer.zip: Remote dependencies (for Lambda Layer)
#
# Usage in consuming repos:
#   includes:
#     lambda:
#       taskfile: https://raw.githubusercontent.com/xoeye/xoi-utils/main/taskfiles/python/poetry-lambda.yml
#       vars:
#         DIR: ./my-lambda
#
# Then run: task lambda:bundle

version: 3

vars:
  OUT: ./lambda_build
  IMAGE: public.ecr.aws/sam/build-python3.12
  PLATFORM: linux/amd64
  DIR: "{{.DIR | default .USER_WORKING_DIR}}"

set: [pipefail]
shopt: [globstar]

tasks:
  clean:
    desc: Remove build artifacts and create fresh output directories
    dir: "{{.DIR}}"
    cmds:
      - rm -rf "{{.OUT}}"
      - mkdir -p "{{.OUT}}/code"
      - mkdir -p "{{.OUT}}/layer/python"

  export:
    desc: Export Poetry dependencies to requirements files
    deps: [clean]
    dir: "{{.DIR}}"
    cmds:
      - poetry export --without-hashes --format=requirements.txt --output "{{.OUT}}/requirements.txt"
      - grep -Ev 'file://' "{{.OUT}}/requirements.txt" > "{{.OUT}}/requirements-remote.txt"
      - touch "{{.OUT}}/requirements-local.txt"
      - cmd: grep -E 'file://' "{{.OUT}}/requirements.txt" | sed -E 's/^-e //' > "{{.OUT}}/requirements-local.txt"
        ignore_error: true

  build-code:
    desc: Build code.zip with application code and local dependencies
    dir: "{{.DIR}}"
    cmds:
      # Install the current package *and* all locally editable packages in code bundle
      # All the other dependencies (including transitive ones) are in requirements-remote.txt
      # and will be provided in the requirements layer
      - |
        pip install . \
          -r "{{.OUT}}/requirements-local.txt" \
          --no-deps \
          --target "{{.OUT}}/code"
      - sync
      - rm -rf "{{.OUT}}"/code/*.dist-info
      - cd "{{.OUT}}/code" && zip -r -0 -q ../code.zip .

  build-layer:
    desc: Build layer.zip with remote dependencies using Docker
    dir: "{{.DIR}}"
    cmds:
      - |
        docker run --rm \
          --platform {{.PLATFORM}} \
          -v {{.OUT}}:/opt/build \
          -v ~/.netrc:/root/.netrc \
          {{.IMAGE}} \
          bash -c "python -m venv /opt/venv && /opt/venv/bin/pip install -r /opt/build/requirements-remote.txt -t /opt/build/layer/python"
      - cd "{{.OUT}}/layer" && zip -r -0 -q ../layer.zip .

  bundle:
    desc: Build both code.zip and layer.zip (main entry point)
    dir: "{{.DIR}}"
    cmds:
      - task: export
      - task: bundle-parallel

  default:
    cmds:
      - task: bundle

  bundle-parallel:
    internal: true
    deps: [build-code, build-layer]
